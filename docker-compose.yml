services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PODCAST_DB:-podcast_db}
      POSTGRES_USER: ${PODCAST_DB_USER:-podcast_user}
      POSTGRES_PASSWORD: ${PODCAST_DB_PASSWORD:-podcast_pass}
    ports:
      - "${PODCAST_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PODCAST_DB_USER:-podcast_user} -d ${PODCAST_DB:-podcast_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    restart: unless-stopped
    ports:
      - "${PODCAST_KAFKA_INTERNAL_PORT:-9092}:9092"
      - "${PODCAST_KAFKA_EXTERNAL_PORT:-9094}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${PODCAST_KAFKA_EXTERNAL_HOST:-host.docker.internal}:${PODCAST_KAFKA_EXTERNAL_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${PODCAST_KAFKA_AUTO_CREATE_TOPICS_ENABLE:-true}

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "${PODCAST_KAFKA_UI_PORT:-8081}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--spring.profiles.active=${PODCAST_SPRING_PROFILES_ACTIVE:-docker,dev}"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      PODCAST_SERVER_PORT: ${PODCAST_SERVER_PORT:-8082}
      PODCAST_SERVER_SERVLET_CONTEXT_PATH: ${PODCAST_SERVER_SERVLET_CONTEXT_PATH:-/podcast/v1}
      PODCAST_DB_URL: jdbc:postgresql://postgres:5432/${PODCAST_DB:-podcast_db}
      PODCAST_DB_USER: ${PODCAST_DB_USER:-podcast_user}
      PODCAST_DB_PASSWORD: ${PODCAST_DB_PASSWORD:-podcast_pass}
      PODCAST_KAFKA_BOOTSTRAP_SERVERS: ${PODCAST_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      PODCAST_KAFKA_CONSUMER_GROUP: ${PODCAST_KAFKA_CONSUMER_GROUP:-podcast-service}
      PODCAST_KAFKA_TOPIC_USER_REGISTER: ${PODCAST_KAFKA_TOPIC_USER_REGISTER:-podcast.user.register}
      PODCAST_KAFKA_TOPIC_MEDIA_UPLOAD: ${PODCAST_KAFKA_TOPIC_MEDIA_UPLOAD:-media.upload}
      PODCAST_KAFKA_TOPIC_MEDIA_WORKER: ${PODCAST_KAFKA_TOPIC_MEDIA_WORKER:-media.worker}
      PODCAST_KAFKA_TOPIC_MEDIA_SUBTITLE: ${PODCAST_KAFKA_TOPIC_MEDIA_SUBTITLE:-media.subtitle}
      PODCAST_KAFKA_TOPIC_TTS_START: ${PODCAST_KAFKA_TOPIC_TTS_START:-tts.start}
      PODCAST_KAFKA_TOPIC_TTS_FAILED: ${PODCAST_KAFKA_TOPIC_TTS_FAILED:-tts.failed}
      PODCAST_KAFKA_TOPIC_PODCAST_ACTIVITY_EVENTS: ${PODCAST_KAFKA_TOPIC_PODCAST_ACTIVITY_EVENTS:-podcast.activity.events.v1}
      PODCAST_KAFKA_TOPIC_PODCAST_CONTENT_EVENTS: ${PODCAST_KAFKA_TOPIC_PODCAST_CONTENT_EVENTS:-podcast.content.events.v1}
      PODCAST_KAFKA_TOPIC_PODCAST_SEARCH_EVENTS: ${PODCAST_KAFKA_TOPIC_PODCAST_SEARCH_EVENTS:-podcast.search.events.v1}
      PODCAST_KAFKA_RETRY_BACKOFF_MS: ${PODCAST_KAFKA_RETRY_BACKOFF_MS:-1000}
      PODCAST_KAFKA_RETRY_MAX_ATTEMPTS: ${PODCAST_KAFKA_RETRY_MAX_ATTEMPTS:-3}
      PODCAST_KAFKA_DLT_SUFFIX: ${PODCAST_KAFKA_DLT_SUFFIX:-.DLT}
      PODCAST_KAFKA_DLT_TOPIC_PODCAST_ACTIVITY_EVENTS: ${PODCAST_KAFKA_DLT_TOPIC_PODCAST_ACTIVITY_EVENTS:-podcast.activity.events.v1.DLT}
      PODCAST_KAFKA_DLT_TOPIC_PODCAST_CONTENT_EVENTS: ${PODCAST_KAFKA_DLT_TOPIC_PODCAST_CONTENT_EVENTS:-podcast.content.events.v1.DLT}
      PODCAST_KAFKA_DLT_TOPIC_PODCAST_SEARCH_EVENTS: ${PODCAST_KAFKA_DLT_TOPIC_PODCAST_SEARCH_EVENTS:-podcast.search.events.v1.DLT}
      PODCAST_KAFKA_PRODUCER_ENABLED: ${PODCAST_KAFKA_PRODUCER_ENABLED:-false}
      PODCAST_RECOMMENDATION_EVENTS_ENABLED: ${PODCAST_RECOMMENDATION_EVENTS_ENABLED:-false}
      PODCAST_OUTBOX_PUBLISHER_ENABLED: ${PODCAST_OUTBOX_PUBLISHER_ENABLED:-false}
      PODCAST_OUTBOX_BATCH_SIZE: ${PODCAST_OUTBOX_BATCH_SIZE:-100}
      PODCAST_OUTBOX_PUBLISH_DELAY_MS: ${PODCAST_OUTBOX_PUBLISH_DELAY_MS:-3000}
      PODCAST_OUTBOX_MAX_RETRY_ATTEMPTS: ${PODCAST_OUTBOX_MAX_RETRY_ATTEMPTS:-10}
      PODCAST_OUTBOX_PROCESSING_TIMEOUT_MS: ${PODCAST_OUTBOX_PROCESSING_TIMEOUT_MS:-600000}
      PODCAST_OUTBOX_SEND_TIMEOUT_MS: ${PODCAST_OUTBOX_SEND_TIMEOUT_MS:-10000}
      PODCAST_OPENROUTER_ENABLED: ${PODCAST_OPENROUTER_ENABLED:-false}
      PODCAST_OPENROUTER_API_KEY: ${PODCAST_OPENROUTER_API_KEY:-}
      PODCAST_OPENROUTER_BASE_URL: ${PODCAST_OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      PODCAST_OPENROUTER_MODEL: ${PODCAST_OPENROUTER_MODEL:-openrouter/free}
      PODCAST_OPENROUTER_SITE_URL: ${PODCAST_OPENROUTER_SITE_URL:-https://example.local}
      PODCAST_OPENROUTER_APP_TITLE: ${PODCAST_OPENROUTER_APP_TITLE:-Podcast Summary Bot}
      PODCAST_OPENROUTER_TEMPERATURE: ${PODCAST_OPENROUTER_TEMPERATURE:-0.3}
      PODCAST_OPENROUTER_MAX_TOKENS: ${PODCAST_OPENROUTER_MAX_TOKENS:-500}
      PODCAST_OPENROUTER_CONNECT_TIMEOUT: ${PODCAST_OPENROUTER_CONNECT_TIMEOUT:-3s}
      PODCAST_OPENROUTER_READ_TIMEOUT: ${PODCAST_OPENROUTER_READ_TIMEOUT:-60s}
      PODCAST_OPENROUTER_MAX_ATTEMPTS: ${PODCAST_OPENROUTER_MAX_ATTEMPTS:-3}
      PODCAST_OPENROUTER_RETRY_BACKOFF: ${PODCAST_OPENROUTER_RETRY_BACKOFF:-500ms}
      PODCAST_SUMMARY_DIRECT_MAX_CHARS: ${PODCAST_SUMMARY_DIRECT_MAX_CHARS:-50000}
      PODCAST_SUMMARY_CHUNK_SIZE_CHARS: ${PODCAST_SUMMARY_CHUNK_SIZE_CHARS:-30000}
      PODCAST_SUMMARY_SYSTEM_PROMPT: ${PODCAST_SUMMARY_SYSTEM_PROMPT:-Ты сервис генерации summary для подкастов. Отвечай на языке RU. Не добавляй факты, которых нет в transcript. Не используй markdown.}
      PODCAST_SUMMARY_DIRECT_PROMPT: ${PODCAST_SUMMARY_DIRECT_PROMPT:-Сделай краткое summary этого transcript для карточки подкаста. Summary должно быть 3-6 предложений. Transcript:}
      PODCAST_SUMMARY_CHUNK_PROMPT: ${PODCAST_SUMMARY_CHUNK_PROMPT:-Сделай краткое промежуточное summary этого фрагмента transcript. Fragment:}
      PODCAST_SUMMARY_FINAL_PROMPT: ${PODCAST_SUMMARY_FINAL_PROMPT:-Объедини промежуточные summary в одно итоговое summary. Partial summaries:}
      PODCAST_SUBTITLE_STORAGE_BASE_URL: ${PODCAST_SUBTITLE_STORAGE_BASE_URL:-}
      PODCAST_SUBTITLE_STORAGE_CONNECT_TIMEOUT: ${PODCAST_SUBTITLE_STORAGE_CONNECT_TIMEOUT:-3s}
      PODCAST_SUBTITLE_STORAGE_READ_TIMEOUT: ${PODCAST_SUBTITLE_STORAGE_READ_TIMEOUT:-20s}
      PODCAST_AUTH_SERVICE_BASE_URL: ${PODCAST_AUTH_SERVICE_BASE_URL:-http://auth-service:8080}
      PODCAST_AUTH_SERVICE_CONNECT_TIMEOUT: ${PODCAST_AUTH_SERVICE_CONNECT_TIMEOUT:-2s}
      PODCAST_AUTH_SERVICE_READ_TIMEOUT: ${PODCAST_AUTH_SERVICE_READ_TIMEOUT:-5s}
      PODCAST_ACCESS_TOKEN_SECRET: ${PODCAST_ACCESS_TOKEN_SECRET:-dev-access-token-secret-change-me}
      PODCAST_ACCESS_TOKEN_ISSUER: ${PODCAST_ACCESS_TOKEN_ISSUER:-auth-service}
      PODCAST_AUTH_ENABLED: ${PODCAST_AUTH_ENABLED:-true}
      PODCAST_CORS_ALLOWED_ORIGINS: ${PODCAST_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8082}
      PODCAST_DEV_SEED_ENABLED: ${PODCAST_DEV_SEED_ENABLED:-true}
      PODCAST_SWAGGER_ENABLED: ${PODCAST_SWAGGER_ENABLED:-true}
      PODCAST_SWAGGER_OPENAPI_URL: ${PODCAST_SWAGGER_OPENAPI_URL:-/openapi/podcast-service-dev.yaml}
      # OpenTelemetry Java agent → OTEL collector (traces / metrics / logs)
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-podcast_core}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=podcast,deployment.environment=${DEPLOYMENT_ENV:-dev}
    ports:
      - "${PODCAST_APP_PORT:-8082}:${PODCAST_SERVER_PORT:-8082}"
    networks:
      - default
      - otel

volumes:
  postgres_data:

networks:
  otel:
    external: true
    name: ot_collector_otel

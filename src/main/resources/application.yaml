spring:
  application:
    name: podcastService

  datasource:
    url: ${PODCAST_DB_URL:jdbc:postgresql://localhost:5432/podcast_db}
    username: ${PODCAST_DB_USER:podcast_user}
    password: ${PODCAST_DB_PASSWORD:podcast_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${PODCAST_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      ack-mode: record
    consumer:
      group-id: ${PODCAST_KAFKA_CONSUMER_GROUP:podcast-service}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  dev-seed:
    enabled: ${PODCAST_DEV_SEED_ENABLED:false}
  cors:
    allowed-origins: ${PODCAST_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8082}
  auth:
    service:
      base-url: ${PODCAST_AUTH_SERVICE_BASE_URL:http://localhost:8080}
      connect-timeout: ${PODCAST_AUTH_SERVICE_CONNECT_TIMEOUT:2s}
      read-timeout: ${PODCAST_AUTH_SERVICE_READ_TIMEOUT:5s}
    jwt:
      enabled: ${PODCAST_AUTH_ENABLED:true}
      secret: ${PODCAST_ACCESS_TOKEN_SECRET:}
      issuer: ${PODCAST_ACCESS_TOKEN_ISSUER:auth-service}
  kafka:
    topics:
      user-register: ${PODCAST_KAFKA_TOPIC_USER_REGISTER:podcast.user.register}
      media-upload: ${PODCAST_KAFKA_TOPIC_MEDIA_UPLOAD:media.upload}
      media-worker: ${PODCAST_KAFKA_TOPIC_MEDIA_WORKER:media.worker}
      media-subtitle: ${PODCAST_KAFKA_TOPIC_MEDIA_SUBTITLE:media.subtitle}
      tts-start: ${PODCAST_KAFKA_TOPIC_TTS_START:tts.start}
      tts-failed: ${PODCAST_KAFKA_TOPIC_TTS_FAILED:tts.failed}
      podcast-activity-events: ${PODCAST_KAFKA_TOPIC_PODCAST_ACTIVITY_EVENTS:podcast.activity.events.v1}
      podcast-content-events: ${PODCAST_KAFKA_TOPIC_PODCAST_CONTENT_EVENTS:podcast.content.events.v1}
      podcast-search-events: ${PODCAST_KAFKA_TOPIC_PODCAST_SEARCH_EVENTS:podcast.search.events.v1}
    retry:
      backoff-ms: ${PODCAST_KAFKA_RETRY_BACKOFF_MS:1000}
      max-attempts: ${PODCAST_KAFKA_RETRY_MAX_ATTEMPTS:3}
    dlt:
      suffix: ${PODCAST_KAFKA_DLT_SUFFIX:.DLT}
      podcast-activity-events: ${PODCAST_KAFKA_DLT_TOPIC_PODCAST_ACTIVITY_EVENTS:podcast.activity.events.v1.DLT}
      podcast-content-events: ${PODCAST_KAFKA_DLT_TOPIC_PODCAST_CONTENT_EVENTS:podcast.content.events.v1.DLT}
      podcast-search-events: ${PODCAST_KAFKA_DLT_TOPIC_PODCAST_SEARCH_EVENTS:podcast.search.events.v1.DLT}
    producer:
      enabled: ${PODCAST_KAFKA_PRODUCER_ENABLED:false}
  outbox:
    publisher:
      enabled: ${PODCAST_OUTBOX_PUBLISHER_ENABLED:false}
      batch-size: ${PODCAST_OUTBOX_BATCH_SIZE:100}
      publish-delay-ms: ${PODCAST_OUTBOX_PUBLISH_DELAY_MS:3000}
      max-retry-attempts: ${PODCAST_OUTBOX_MAX_RETRY_ATTEMPTS:10}
      processing-timeout-ms: ${PODCAST_OUTBOX_PROCESSING_TIMEOUT_MS:600000}
      send-timeout-ms: ${PODCAST_OUTBOX_SEND_TIMEOUT_MS:10000}
  recommendation:
    events:
      enabled: ${PODCAST_RECOMMENDATION_EVENTS_ENABLED:false}
  openrouter:
    enabled: ${PODCAST_OPENROUTER_ENABLED:false}
    api-key: ${PODCAST_OPENROUTER_API_KEY:}
    base-url: ${PODCAST_OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    model: ${PODCAST_OPENROUTER_MODEL:openrouter/free}
    site-url: ${PODCAST_OPENROUTER_SITE_URL:https://example.local}
    app-title: ${PODCAST_OPENROUTER_APP_TITLE:Podcast Summary Bot}
    temperature: ${PODCAST_OPENROUTER_TEMPERATURE:0.3}
    max-tokens: ${PODCAST_OPENROUTER_MAX_TOKENS:500}
    connect-timeout: ${PODCAST_OPENROUTER_CONNECT_TIMEOUT:3s}
    read-timeout: ${PODCAST_OPENROUTER_READ_TIMEOUT:60s}
    max-attempts: ${PODCAST_OPENROUTER_MAX_ATTEMPTS:3}
    retry-backoff: ${PODCAST_OPENROUTER_RETRY_BACKOFF:500ms}
  summary:
    direct-max-chars: ${PODCAST_SUMMARY_DIRECT_MAX_CHARS:50000}
    chunk-size-chars: ${PODCAST_SUMMARY_CHUNK_SIZE_CHARS:30000}
    prompts:
      system: ${PODCAST_SUMMARY_SYSTEM_PROMPT:}
      direct-summary: ${PODCAST_SUMMARY_DIRECT_PROMPT:}
      chunk-summary: ${PODCAST_SUMMARY_CHUNK_PROMPT:}
      final-summary: ${PODCAST_SUMMARY_FINAL_PROMPT:}

server:
  port: ${PODCAST_SERVER_PORT:8082}
  servlet:
    context-path: ${PODCAST_SERVER_SERVLET_CONTEXT_PATH:/podcast/v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.flywaydb: INFO
    org.springframework.kafka: INFO

springdoc:
  api-docs:
    enabled: ${PODCAST_SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${PODCAST_SWAGGER_ENABLED:false}
    path: /swagger
    url: ${PODCAST_SWAGGER_OPENAPI_URL:openapi/podcast-service-dev.yaml}
    disable-swagger-default-url: true
    tryItOutEnabled: true

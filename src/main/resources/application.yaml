spring:
  application:
    name: podcastService

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/podcast_db}
    username: ${DB_USERNAME:podcast_user}
    password: ${DB_PASSWORD:podcast_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:podcast-service}
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "podcastService.infrastructure.messaging.event,podcastService.user.dto"
        spring.json.use.type.headers: false
        spring.json.value.default.type: "podcastService.infrastructure.messaging.event.EventEnvelope"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8082}
  auth:
    jwt:
      enabled: ${AUTH_ENABLED:true}
      secret: ${ACCESS_TOKEN_SECRET:}
      issuer: ${ACCESS_TOKEN_ISSUER:auth-service}
  kafka:
    topics:
      users: ${KAFKA_TOPIC_USERS:podcasts.users}
      podcasts: ${KAFKA_TOPIC_PODCASTS:podcasts.podcasts}
    routing:
      user.created: users

server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/podcast/v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.flywaydb: INFO
    org.springframework.kafka: INFO

springdoc:
  swagger-ui:
    path: /swagger
    url: ${SWAGGER_OPENAPI_URL:/podcast/v1/openapi/podcast-service-dev.yaml}
    disable-swagger-default-url: true
    tryItOutEnabled: true

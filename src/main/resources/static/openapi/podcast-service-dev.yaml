openapi: 3.0.3

info:
  title: Podcast Service API (DEV)
  version: 1.3.0-dev
  description: |
    DEV-спецификация отражает текущую реализованную часть сервиса.

    Авторизация выполняется через `Authorization: Bearer <access_token>`.
    Access token выдаётся auth-service и валидируется локально как HS256 JWT.
    Используемые claims: `user_id`, `email`, `roles`, `iss`, `exp`.

    Роли:
    - `ADMIN` — управление категориями.
    - `AUTHOR` — профиль автора, создание, изменение, удаление и публикация подкастов.
    - авторизованный пользователь — профиль, настройки, плейлисты и голосование.

servers:
  - url: http://localhost:8082/podcast/v1
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: User Profile
    description: Профиль пользователя и настройки
  - name: Categories
    description: Категории подкастов
  - name: Podcasts
    description: CRUD и базовый жизненный цикл подкастов
  - name: Podcast Media
    description: Транскрипт и summary подкаста, подготовленные media/tts-stt сервисом
  - name: Author Profile
    description: Профили авторов и публичные страницы авторов
  - name: Playlists
    description: Плейлисты и управление треклистом
  - name: Votes
    description: Голосование за подкасты и плейлисты
  - name: Subscriptions
    description: Подписки на авторов и лента подписок
  - name: Listen History
    description: История и прогресс прослушивания
  - name: Search
    description: Поиск и подсказки

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token, полученный от auth-service

  parameters:
    PathCategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PathPodcastId:
      name: podcastId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PathPlaylistId:
      name: playlistId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PathAuthorId:
      name: authorId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    Page:
      name: page
      in: query
      required: false
      description: Номер страницы, начиная с 1
      schema:
        type: integer
        minimum: 1
        default: 1

    Size:
      name: size
      in: query
      required: false
      description: Размер страницы, максимум 50
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20

  schemas:
    ErrorResponse:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Request validation failed
        timestamp:
          type: string
          format: date-time
        details:
          type: object
          nullable: true
          additionalProperties: true

    Theme:
      type: string
      enum: [DARK, LIGHT]

    Language:
      type: string
      enum: [RU, EN]

    VoteType:
      type: string
      enum: [LIKE, DISLIKE]

    PodcastStatus:
      type: string
      enum: [DRAFT, PROCESSING, PUBLISHED, FAILED, ARCHIVED]

    SortPodcasts:
      type: string
      enum: [DATE_DESC, DATE_ASC, RATING, VIEWS]
      default: DATE_DESC

    SortPlaylists:
      type: string
      enum: [DATE_DESC, DATE_ASC, RATING]
      default: DATE_DESC

    SearchType:
      type: string
      enum: [ALL, PODCAST, AUTHOR, PLAYLIST]
      default: ALL

    SearchSort:
      type: string
      enum: [RELEVANCE, DATE, RATING, VIEWS]
      default: RELEVANCE

    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 53
        totalPages:
          type: integer
          example: 3

    UserProfileResponse:
      type: object
      required: [id, userId, username, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        username:
          type: string
          example: john_doe
        avatarUrl:
          type: string
          format: uri
          nullable: true
        createdAt:
          type: string
          format: date-time

    UserProfilePrivateResponse:
      allOf:
        - $ref: '#/components/schemas/UserProfileResponse'
        - type: object
          properties:
            theme:
              $ref: '#/components/schemas/Theme'
            language:
              $ref: '#/components/schemas/Language'

    UpdateUserProfileRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-zA-Z0-9_]+$'
          example: john_doe
        avatarUrl:
          type: string
          format: uri
          nullable: true

    UpdateUserSettingsRequest:
      type: object
      properties:
        theme:
          $ref: '#/components/schemas/Theme'
        language:
          $ref: '#/components/schemas/Language'

    UserSettingsResponse:
      type: object
      properties:
        theme:
          $ref: '#/components/schemas/Theme'
        language:
          $ref: '#/components/schemas/Language'

    AuthorProfileResponse:
      type: object
      required: [id, userId, authorName, subscribersCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        authorName:
          type: string
          example: Иван Петров
        avatarUrl:
          type: string
          format: uri
          nullable: true
          description: Берётся из связанного user_profiles.avatar_url
        description:
          type: string
          nullable: true
        subscribersCount:
          type: integer
          format: int64
          example: 12400
        isSubscribed:
          type: boolean
          nullable: true
          description: null для анонимного запроса, true/false для авторизованного
        createdAt:
          type: string
          format: date-time

    CreateAuthorProfileRequest:
      type: object
      required: [authorName]
      properties:
        authorName:
          type: string
          minLength: 2
          maxLength: 100
          example: Иван Петров
        description:
          type: string
          maxLength: 1000
          nullable: true
          example: Рассказываю о технологиях доступным языком

    UpdateAuthorProfileRequest:
      type: object
      properties:
        authorName:
          type: string
          minLength: 2
          maxLength: 100
          example: Иван Петров
        description:
          type: string
          maxLength: 1000
          nullable: true

    CategoryResponse:
      type: object
      required: [id, name, position]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Технологии
        position:
          type: integer
          example: 1

    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Технологии
        position:
          type: integer
          minimum: 0
          example: 1

    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Бизнес
        position:
          type: integer
          minimum: 0
          example: 2

    AuthorCard:
      type: object
      required: [id, authorName, subscribersCount]
      properties:
        id:
          type: string
          format: uuid
        authorName:
          type: string
          example: Иван Петров
        avatarUrl:
          type: string
          format: uri
          nullable: true
        subscribersCount:
          type: integer
          format: int64
          nullable: true
          example: 125
        isSubscribed:
          type: boolean
          nullable: true
          example: false

    PodcastCard:
      type: object
      required: [id, title, author, status, num_speakers, viewsCount, likesCount, dislikesCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Как построить первый продовый backend
        author:
          $ref: '#/components/schemas/AuthorCard'
        category:
          allOf:
            - $ref: '#/components/schemas/CategoryResponse'
          nullable: true
        coverImageUrl:
          type: string
          format: uri
          nullable: true
        durationSeconds:
          type: integer
          nullable: true
          example: 1830
        num_speakers:
          type: integer
          minimum: 1
          maximum: 32
          example: 2
        status:
          $ref: '#/components/schemas/PodcastStatus'
        viewsCount:
          type: integer
          format: int64
          example: 1500
        likesCount:
          type: integer
          format: int64
          example: 220
        dislikesCount:
          type: integer
          format: int64
          example: 4
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        currentUserVote:
          allOf:
            - $ref: '#/components/schemas/VoteType'
          nullable: true
        progressSeconds:
          type: integer
          format: int64
          nullable: true
        progressPercent:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100

    PodcastDetailResponse:
      allOf:
        - $ref: '#/components/schemas/PodcastCard'
        - type: object
          properties:
            description:
              type: string
              nullable: true
              example: Обсуждаем архитектуру сервиса и типичные ошибки при проектировании.
            audioUrl:
              type: string
              format: uri
              nullable: true
            audio_url_file:
              type: string
              nullable: true
              example: /dev/audio/podcast-1.mp3
            audio_size_file:
              type: integer
              format: int64
              nullable: true
              minimum: 0
              example: 52428800
            hasTranscript:
              type: boolean
              nullable: true
              example: false
            hasSummary:
              type: boolean
              nullable: true
              example: false

    PodcastSpeakersResponse:
      type: object
      required: [podcastId, num_speakers]
      description: Количество спикеров в подкасте
      properties:
        podcastId:
          type: string
          format: uuid
          example: 22222222-2222-2222-2222-222222222222
        num_speakers:
          type: integer
          minimum: 1
          maximum: 32
          example: 2

    CreatePodcastRequest:
      type: object
      required: [title, num_speakers]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 255
          example: Как построить первый продовый backend
        description:
          type: string
          maxLength: 5000
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        coverImageUrl:
          type: string
          format: uri
          nullable: true
        num_speakers:
          type: integer
          minimum: 1
          maximum: 32
          example: 2

    UpdatePodcastRequest:
      type: object
      description: Partial update. Должно быть передано хотя бы одно поле.
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 255
        description:
          type: string
          maxLength: 5000
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        coverImageUrl:
          type: string
          format: uri
          nullable: true

    PlaylistOwnerResponse:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          example: john_doe

    PlaylistCard:
      type: object
      required: [id, title, owner, isPublic, podcastsCount, likesCount, dislikesCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Лучшие подкасты про IT
        coverImageUrl:
          type: string
          format: uri
          nullable: true
        owner:
          $ref: '#/components/schemas/PlaylistOwnerResponse'
        isPublic:
          type: boolean
        podcastsCount:
          type: integer
          format: int64
          example: 8
        likesCount:
          type: integer
          format: int64
          example: 55
        dislikesCount:
          type: integer
          format: int64
          example: 2
        createdAt:
          type: string
          format: date-time
        currentUserVote:
          allOf:
            - $ref: '#/components/schemas/VoteType'
          nullable: true

    PlaylistPodcastItem:
      allOf:
        - $ref: '#/components/schemas/PodcastCard'
        - type: object
          required: [position]
          properties:
            position:
              type: integer
              minimum: 1

    PlaylistDetailResponse:
      allOf:
        - $ref: '#/components/schemas/PlaylistCard'
        - type: object
          properties:
            description:
              type: string
              nullable: true
            updatedAt:
              type: string
              format: date-time
            podcasts:
              type: array
              items:
                $ref: '#/components/schemas/PlaylistPodcastItem'

    CreatePlaylistRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 1000
          nullable: true
        coverImageUrl:
          type: string
          format: uri
          nullable: true
        isPublic:
          type: boolean
          default: false

    UpdatePlaylistRequest:
      type: object
      description: Partial update. Должно быть передано хотя бы одно поле.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 1000
          nullable: true
        coverImageUrl:
          type: string
          format: uri
          nullable: true
        isPublic:
          type: boolean

    AddPodcastToPlaylistRequest:
      type: object
      required: [podcastId]
      properties:
        podcastId:
          type: string
          format: uuid

    ReorderPlaylistRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [podcastId, position]
            properties:
              podcastId:
                type: string
                format: uuid
              position:
                type: integer
                minimum: 1

    VoteRequest:
      type: object
      required: [voteType]
      properties:
        voteType:
          $ref: '#/components/schemas/VoteType'

    VoteResponse:
      type: object
      required: [targetId, targetType, likesCount, dislikesCount, currentUserVote]
      properties:
        targetId:
          type: string
          format: uuid
        targetType:
          type: string
          enum: [PODCAST, PLAYLIST]
        likesCount:
          type: integer
          format: int64
        dislikesCount:
          type: integer
          format: int64
        currentUserVote:
          allOf:
            - $ref: '#/components/schemas/VoteType'
          nullable: true

    PodcastTranscriptResponse:
      type: object
      required: [podcastId, language, content, generatedAt]
      properties:
        podcastId:
          type: string
          format: uuid
        language:
          type: string
          example: RU
        content:
          type: string
          description: Полный текст транскрипта
        generatedAt:
          type: string
          format: date-time

    PodcastSummaryResponse:
      type: object
      required: [podcastId, language, content, generatedAt]
      properties:
        podcastId:
          type: string
          format: uuid
        language:
          type: string
          example: RU
        content:
          type: string
          description: AI-сгенерированное краткое содержание
        generatedAt:
          type: string
          format: date-time

    SubscriptionResponse:
      type: object
      required: [author, subscribedAt]
      properties:
        author:
          $ref: '#/components/schemas/AuthorCard'
        subscribedAt:
          type: string
          format: date-time

    AuthorSubscriptionResponse:
      type: object
      required: [authorId, subscribersCount, isSubscribed]
      properties:
        authorId:
          type: string
          format: uuid
        subscribersCount:
          type: integer
          format: int64
        isSubscribed:
          type: boolean

    SaveProgressRequest:
      type: object
      required: [progressSeconds]
      properties:
        progressSeconds:
          type: integer
          minimum: 0

    ListenHistoryItem:
      type: object
      required: [podcast, progressSeconds, completed, lastListenedAt]
      properties:
        podcast:
          $ref: '#/components/schemas/PodcastCard'
        progressSeconds:
          type: integer
        progressPercent:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        completed:
          type: boolean
        lastListenedAt:
          type: string
          format: date-time

    SearchSuggestItem:
      type: object
      required: [type, id, label]
      properties:
        type:
          type: string
          enum: [PODCAST, AUTHOR, PLAYLIST]
        id:
          type: string
          format: uuid
        label:
          type: string
        coverUrl:
          type: string
          format: uri
          nullable: true

    SearchResponse:
      type: object
      properties:
        podcasts:
          $ref: '#/components/schemas/PageOfPodcastCard'
        authors:
          $ref: '#/components/schemas/PageOfAuthorCard'
        playlists:
          $ref: '#/components/schemas/PageOfPlaylistCard'

    PageOfPodcastCard:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PodcastCard'
        meta:
          $ref: '#/components/schemas/PageMeta'

    PageOfPlaylistCard:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlaylistCard'
        meta:
          $ref: '#/components/schemas/PageMeta'

    PageOfAuthorCard:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuthorCard'
        meta:
          $ref: '#/components/schemas/PageMeta'

    PageOfSubscription:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionResponse'
        meta:
          $ref: '#/components/schemas/PageMeta'

    PageOfListenHistory:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ListenHistoryItem'
        meta:
          $ref: '#/components/schemas/PageMeta'

  responses:
    BadRequest:
      description: Невалидные входные данные
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Токен отсутствует, невалиден или истёк
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Недостаточно прав или пользователь не владелец ресурса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: Конфликт данных
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnprocessableEntity:
      description: Бизнес-правило нарушено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:
  /users/me/profile:
    get:
      tags: [User Profile]
      summary: Получить свой профиль
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfilePrivateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [User Profile]
      summary: Обновить свой профиль
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: Обновлённый профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfilePrivateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/me/settings:
    get:
      tags: [User Profile]
      summary: Получить настройки пользователя
      responses:
        '200':
          description: Настройки пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [User Profile]
      summary: Обновить настройки пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserSettingsRequest'
      responses:
        '200':
          description: Обновлённые настройки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/me/playlists:
    get:
      tags: [Playlists]
      summary: Мои плейлисты
      responses:
        '200':
          description: Плейлисты текущего пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOfPlaylistCard'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/subscriptions:
    get:
      tags: [Subscriptions]
      summary: Мои подписки на авторов
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Подписки текущего пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOfSubscription'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/subscriptions/feed:
    get:
      tags: [Subscriptions]
      summary: Лента подписок
      parameters:
        - name: sort
          in: query
          schema:
            $ref: '#/components/schemas/SortPodcasts'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Подкасты авторов, на которых подписан пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOfPodcastCard'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/history:
    get:
      tags: [Listen History]
      summary: История прослушивания
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: История прослушивания текущего пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOfListenHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /authors/me:
    post:
      tags: [Author Profile]
      summary: Создать профиль автора
      description: Требуется роль `AUTHOR`. Пользовательский профиль должен уже существовать в `user_profiles`.
      requestBody:
        required: true

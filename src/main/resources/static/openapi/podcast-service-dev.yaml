openapi: 3.0.3

info:
  title: Podcast Service API (DEV)
  version: 1.1.0-dev
  description: |
    DEV-спецификация для локального тестирования.
    Для user-профиля и podcast write-операций временно вместо JWT используется header `X-User-Id`.
    Спецификация отражает текущее DEV-состояние сервиса:
    - user profile и settings;
    - categories;
    - podcast CRUD + publish flow.

servers:
  - url: http://localhost:8082
    description: Local development

tags:
  - name: User Profile
    description: Профиль пользователя и настройки
  - name: Categories
    description: Категории подкастов
  - name: Podcasts
    description: CRUD и базовый жизненный цикл подкастов

components:
  parameters:
    XUserId:
      name: X-User-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Временный dev-заголовок вместо JWT

    OptionalXUserId:
      name: X-User-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: |
        Необязательный dev-заголовок.
        Используется там, где публичная ручка может дополнительно учитывать текущего пользователя,
        например для доступа автора к своему неопубликованному подкасту.

    PathCategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID категории

    PathPodcastId:
      name: podcastId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID подкаста

    Page:
      name: page
      in: query
      required: false
      description: Номер страницы, начиная с 1
      schema:
        type: integer
        minimum: 1
        default: 1

    Size:
      name: size
      in: query
      required: false
      description: Размер страницы, максимум 50
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20

  schemas:
    ErrorResponse:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Request validation failed
        timestamp:
          type: string
          format: date-time
        details:
          type: object
          nullable: true
          additionalProperties: true

    Theme:
      type: string
      enum: [DARK, LIGHT]

    Language:
      type: string
      enum: [RU, EN]

    VoteType:
      type: string
      enum: [LIKE, DISLIKE]

    PodcastStatus:
      type: string
      enum: [DRAFT, PROCESSING, PUBLISHED, FAILED, ARCHIVED]

    SortPodcasts:
      type: string
      enum: [DATE_DESC, DATE_ASC, RATING, VIEWS]
      default: DATE_DESC

    UserProfileResponse:
      type: object
      required: [id, userId, username, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        username:
          type: string
          example: john_doe
        avatarUrl:
          type: string
          format: uri
          nullable: true
        createdAt:
          type: string
          format: date-time

    UserProfilePrivateResponse:
      allOf:
        - $ref: '#/components/schemas/UserProfileResponse'
        - type: object
          properties:
            theme:
              $ref: '#/components/schemas/Theme'
            language:
              $ref: '#/components/schemas/Language'

    UpdateUserProfileRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-zA-Z0-9_]+$'
          example: john_doe
        avatarUrl:
          type: string
          format: uri
          nullable: true

    UpdateUserSettingsRequest:
      type: object
      properties:
        theme:
          $ref: '#/components/schemas/Theme'
        language:
          $ref: '#/components/schemas/Language'

    UserSettingsResponse:
      type: object
      properties:
        theme:
          $ref: '#/components/schemas/Theme'
        language:
          $ref: '#/components/schemas/Language'

    CategoryResponse:
      type: object
      required: [id, name, position]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Технологии
        position:
          type: integer
          example: 1
          description: Порядок отображения в UI

    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Технологии
        position:
          type: integer
          minimum: 0
          example: 1
          description: Необязательная позиция в списке

    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Бизнес
        position:
          type: integer
          minimum: 0
          example: 2

    AuthorCard:
      type: object
      required: [id, authorName]
      properties:
        id:
          type: string
          format: uuid
        authorName:
          type: string
          example: Иван Петров
        avatarUrl:
          type: string
          format: uri
          nullable: true
        subscribersCount:
          type: integer
          format: int64
          nullable: true
          example: 125
        isSubscribed:
          type: boolean
          nullable: true
          example: false

    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 53
        totalPages:
          type: integer
          example: 3

    PodcastCard:
      type: object
      required:
        - id
        - title
        - author
        - status
        - viewsCount
        - likesCount
        - dislikesCount
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Как построить первый продовый backend
        author:
          $ref: '#/components/schemas/AuthorCard'
        category:
          allOf:
            - $ref: '#/components/schemas/CategoryResponse'
          nullable: true
        coverImageUrl:
          type: string
          format: uri
          nullable: true
        durationSeconds:
          type: integer
          nullable: true
          example: 1830
        status:
          $ref: '#/components/schemas/PodcastStatus'
        viewsCount:
          type: integer
          format: int64
          example: 1500
        likesCount:
          type: integer
          format: int64
          example: 220
        dislikesCount:
          type: integer
          format: int64
          example: 4
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        currentUserVote:
          allOf:
            - $ref: '#/components/schemas/VoteType'
          nullable: true
        progressSeconds:
          type: integer
          format: int64
          nullable: true
        progressPercent:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100

    PodcastDetailResponse:
      allOf:
        - $ref: '#/components/schemas/PodcastCard'
        - type: object
          properties:
            description:
              type: string
              nullable: true
              example: Обсуждаем архитектуру сервиса и типичные ошибки при проектировании.
            audioUrl:
              type: string
              format: uri
              nullable: true
            hasTranscript:
              type: boolean
              nullable: true
              example: false
            hasSummary:
              type: boolean
              nullable: true
              example: false

    CreatePodcastRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 255
          example: Как построить первый продовый backend
        description:
          type: string
          maxLength: 5000
          nullable: true
          example: Разбираем архитектуру, ошибки и подходы к разработке микросервисов.
        categoryId:
          type: string
          format: uuid
          nullable: true
        coverImageUrl:
          type: string
          format: uri
          nullable: true
          example: https://cdn.example.com/podcasts/backend-cover.png

    UpdatePodcastRequest:
      type: object
      description: |
        DEV-версия partial update для подкаста.
        Можно передать одно или несколько полей.
        Если тело пустое, сервис должен вернуть 400.
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 255
          example: Обновлённый заголовок подкаста
        description:
          type: string
          maxLength: 5000
          example: Обновлённое описание подкаста.
        categoryId:
          type: string
          format: uuid
          nullable: true
        coverImageUrl:
          type: string
          format: uri
          nullable: true

    PodcastListResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PodcastCard'
        meta:
          $ref: '#/components/schemas/PageMeta'

  responses:
    BadRequest:
      description: Невалидные входные данные
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnprocessableEntity:
      description: Бизнес-правило нарушено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:
  /users/me/profile:
    get:
      tags: [User Profile]
      summary: Получить свой профиль
      parameters:
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfilePrivateResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [User Profile]
      summary: Обновить свой профиль
      parameters:
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
            examples:
              updateUsername:
                value:
                  username: john_doe
              updateAvatar:
                value:
                  avatarUrl: https://cdn.example.com/avatar.png
              clearAvatar:
                value:
                  avatarUrl: ""
      responses:
        '200':
          description: Обновлённый профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfilePrivateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/me/settings:
    get:
      tags: [User Profile]
      summary: Получить настройки пользователя
      parameters:
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: Настройки пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettingsResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [User Profile]
      summary: Обновить настройки пользователя
      parameters:
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserSettingsRequest'
            examples:
              updateTheme:
                value:
                  theme: LIGHT
              updateLanguage:
                value:
                  language: EN
              updateBoth:
                value:
                  theme: DARK
                  language: RU
      responses:
        '200':
          description: Обновлённые настройки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /categories:
    get:
      tags: [Categories]
      summary: Список всех категорий
      description: |
        Возвращает плоский список категорий, отсортированный по полю `position`.
        Используется для фильтров в поиске и при создании подкаста.
      operationId: getCategories
      responses:
        '200':
          description: Список категорий
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'

    post:
      tags: [Categories]
      summary: Создать категорию
      description: Создаёт новую категорию.
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
            example:
              name: Технологии
              position: 1
      responses:
        '201':
          description: Категория создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /categories/{categoryId}:
    put:
      tags: [Categories]
      summary: Обновить категорию
      description: Изменяет название и/или позицию.
      operationId: updateCategory
      parameters:
        - $ref: '#/components/parameters/PathCategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
            examples:
              updateName:
                value:
                  name: Бизнес
              updatePosition:
                value:
                  position: 2
              updateBoth:
                value:
                  name: Бизнес
                  position: 2
      responses:
        '200':
          description: Обновлённая категория
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Categories]
      summary: Удалить категорию
      description: |
        Нельзя удалить категорию, которая используется в подкастах
        или нарушает бизнес-ограничения.
      operationId: deleteCategory
      parameters:
        - $ref: '#/components/parameters/PathCategoryId'
      responses:
        '204':
          description: Категория удалена
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /podcasts:
    get:
      tags: [Podcasts]
      summary: Список опубликованных подкастов
      description: |
        Публичный список подкастов с динамической фильтрацией, сортировкой и пагинацией.
        В DEV-режиме список по умолчанию возвращает только `PUBLISHED` подкасты.
      operationId: listPodcasts
      parameters:
        - name: q
          in: query
          required: false
          description: Поиск по title и description
          schema:
            type: string
            example: backend
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: authorId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: sort
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SortPodcasts'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/OptionalXUserId'
      responses:
        '200':
          description: Страница с подкастами
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PodcastListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

    post:
      tags: [Podcasts]
      summary: Создать подкаст
      description: |
        Создаёт новый подкаст в статусе `DRAFT`.
        В DEV-режиме вместо JWT используется обязательный заголовок `X-User-Id`.
      operationId: createPodcast
      parameters:
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePodcastRequest'
            examples:
              minimal:
                value:
                  title: Как построить первый продовый backend
              full:
                value:
                  title: Как построить первый продовый backend
                  description: Разбираем архитектуру, ошибки и подходы к разработке микросервисов.
                  categoryId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  coverImageUrl: https://cdn.example.com/podcasts/backend-cover.png
      responses:
        '201':
          description: Подкаст создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PodcastDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /podcasts/{podcastId}:
    get:
      tags: [Podcasts]
      summary: Получить детальную информацию о подкасте
      description: |
        Публично доступен только `PUBLISHED` подкаст.
        Автор может получить доступ к своему подкасту в других статусах,
        если передан `X-User-Id`.
      operationId: getPodcastById
      parameters:
        - $ref: '#/components/parameters/PathPodcastId'
        - $ref: '#/components/parameters/OptionalXUserId'
      responses:
        '200':
          description: Детальная карточка подкаста
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PodcastDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Podcasts]
      summary: Обновить подкаст
      description: |
        Частичное обновление метаданных подкаста.
        Допускается передача одного или нескольких полей.
        Обновлять подкаст может только его автор.
      operationId: updatePodcast
      parameters:
        - $ref: '#/components/parameters/PathPodcastId'
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePodcastRequest'
            examples:
              updateTitle:
                value:
                  title: Новый заголовок подкаста
              updateCategory:
                value:
                  categoryId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              updateMultiple:
                value:
                  title: Новый заголовок подкаста
                  description: Новое описание
                  coverImageUrl: https://cdn.example.com/podcasts/new-cover.png
      responses:
        '200':
          description: Подкаст обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PodcastDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags: [Podcasts]
      summary: Архивировать подкаст
      description: |
        DEV-операция мягкого удаления.
        Подкаст переводится в статус `ARCHIVED`, физического удаления нет.
      operationId: archivePodcast
      parameters:
        - $ref: '#/components/parameters/PathPodcastId'
        - $ref: '#/components/parameters/XUserId'
      responses:
        '204':
          description: Подкаст архивирован
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /podcasts/{podcastId}/publish:
    post:
      tags: [Podcasts]
      summary: Отправить подкаст в обработку
      description: |
        Переводит подкаст в статус `PROCESSING`.
        В текущей DEV-версии ручка предназначена для базового publish-flow.
      operationId: publishPodcast
      parameters:
        - $ref: '#/components/parameters/PathPodcastId'
        - $ref: '#/components/parameters/XUserId'
      responses:
        '202':
          description: Подкаст принят в обработку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PodcastDetailResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

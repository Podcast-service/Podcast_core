openapi: 3.0.3

info:
  title: Podcast Service API (DEV)
  version: 1.0.0-dev
  description: |
    DEV-спецификация для локального тестирования.
    Для user-профиля временно вместо JWT используется header `X-User-Id`.
    Категории добавлены по оригинальной документации, но без JWT-аутентификации.

servers:
  - url: http://localhost:8082
    description: Local development

tags:
  - name: User Profile
    description: Профиль пользователя и настройки
  - name: Categories
    description: Категории подкастов

components:
  parameters:
    XUserId:
      name: X-User-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Временный dev-заголовок вместо JWT

    PathCategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID категории

  schemas:
    ErrorResponse:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Request validation failed
        timestamp:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties: true

    Theme:
      type: string
      enum: [DARK, LIGHT]

    Language:
      type: string
      enum: [RU, EN]

    UserProfileResponse:
      type: object
      required: [id, userId, username, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        username:
          type: string
          example: john_doe
        avatarUrl:
          type: string
          format: uri
          nullable: true
        createdAt:
          type: string
          format: date-time

    UserProfilePrivateResponse:
      allOf:
        - $ref: '#/components/schemas/UserProfileResponse'
        - type: object
          properties:
            theme:
              $ref: '#/components/schemas/Theme'
            language:
              $ref: '#/components/schemas/Language'

    UpdateUserProfileRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-zA-Z0-9_]+$'
          example: john_doe
        avatarUrl:
          type: string
          format: uri
          nullable: true

    UpdateUserSettingsRequest:
      type: object
      properties:
        theme:
          $ref: '#/components/schemas/Theme'
        language:
          $ref: '#/components/schemas/Language'

    UserSettingsResponse:
      type: object
      properties:
        theme:
          $ref: '#/components/schemas/Theme'
        language:
          $ref: '#/components/schemas/Language'

    CategoryResponse:
      type: object
      required: [id, name, position]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Технологии
        position:
          type: integer
          example: 1
          description: Порядок отображения в UI

    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Технологии
        position:
          type: integer
          example: 1
          description: Необязательная позиция в списке

    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Бизнес
        position:
          type: integer
          example: 2

  responses:
    BadRequest:
      description: Невалидные входные данные
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnprocessableEntity:
      description: Бизнес-правило нарушено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:
  /users/me/profile:
    get:
      tags: [User Profile]
      summary: Получить свой профиль
      parameters:
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfilePrivateResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [User Profile]
      summary: Обновить свой профиль
      parameters:
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
            examples:
              updateUsername:
                value:
                  username: john_doe
              updateAvatar:
                value:
                  avatarUrl: https://cdn.example.com/avatar.png
              clearAvatar:
                value:
                  avatarUrl: ""
      responses:
        '200':
          description: Обновлённый профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfilePrivateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/me/settings:
    get:
      tags: [User Profile]
      summary: Получить настройки пользователя
      parameters:
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: Настройки пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettingsResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [User Profile]
      summary: Обновить настройки пользователя
      parameters:
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserSettingsRequest'
            examples:
              updateTheme:
                value:
                  theme: LIGHT
              updateLanguage:
                value:
                  language: EN
              updateBoth:
                value:
                  theme: DARK
                  language: RU
      responses:
        '200':
          description: Обновлённые настройки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /categories:
    get:
      tags: [Categories]
      summary: Список всех категорий
      description: |
        Возвращает плоский список категорий, отсортированный по полю `position`.
        Используется для фильтров в поиске и при создании подкаста.
      operationId: getCategories
      responses:
        '200':
          description: Список категорий
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'

    post:
      tags: [Categories]
      summary: Создать категорию
      description: Создаёт новую категорию.
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
            example:
              name: Технологии
              position: 1
      responses:
        '201':
          description: Категория создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /categories/{categoryId}:
    put:
      tags: [Categories]
      summary: Обновить категорию
      description: Изменяет название и/или позицию.
      operationId: updateCategory
      parameters:
        - $ref: '#/components/parameters/PathCategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
            examples:
              updateName:
                value:
                  name: Бизнес
              updatePosition:
                value:
                  position: 2
              updateBoth:
                value:
                  name: Бизнес
                  position: 2
      responses:
        '200':
          description: Обновлённая категория
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Categories]
      summary: Удалить категорию
      description: |
        Нельзя удалить категорию, которая используется в подкастах
        или нарушает бизнес-ограничения.
      operationId: deleteCategory
      parameters:
        - $ref: '#/components/parameters/PathCategoryId'
      responses:
        '204':
          description: Категория удалена
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'